title: "Cloud Infrastructure: NYC 311 Pipeline"

short_summary: >
  Developed a scalable data pipeline using AWS services. Configured S3 for data storage, 
  setup Athena for serverless SQL queries, and used SageMaker for data exploration.

tech_stack:
  - AWS S3
  - AWS Athena
  - AWS SageMaker
  - SQL
  - Python (Pandas)

problem_statement: >
  Large-scale urban datasets like the NYC 311 service requests are too large for traditional 
  local processing. The goal was to build a cloud-native infrastructure that allows for 
  efficient storage, rapid querying, and machine learning readiness without taxing local hardware.

approach: >
  I established a 'Bronze/Silver' data lake pattern in S3, using specific prefixes to organize 
  raw and cleaned data. I then mapped this data to AWS Athena to perform serverless SQL 
  analysis. Finally, I connected a SageMaker Jupyter instance to the Athena lifecycle to 
  prepare the data for predictive modeling.

results_impact: >
  The resulting infrastructure allows for querying millions of rows in seconds using SQL. 
  The project is fully documented in a public AWS Cloud Computing repository, meeting 
  all requirements for professional cloud data engineering standards.

