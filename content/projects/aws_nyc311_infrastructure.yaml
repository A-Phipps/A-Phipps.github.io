title: "NYC 311 Cloud Data Pipeline"
short_summary: >
  Built a cloud-based data pipeline to store and query 200,000 NYC service
  requests using AWS. Uploaded raw CSV data to S3, queried it with SQL through
  Athena, and loaded results into SageMaker to prepare for predictive modeling.
tech_stack:
  - AWS S3
  - AWS Athena
  - AWS SageMaker
  - SQL
  - Python (Pandas, boto3)
problem_statement: >
  A dataset of 200,000 NYC 311 complaints is too large to work with comfortably
  on a laptop. The goal was to store the data in the cloud, query it efficiently
  without downloading it, and set up an environment ready for machine learning.
approach: >
  I created an S3 bucket to store the raw complaints and agency CSV files in an
  organized folder structure. I then used AWS Athena to run SQL queries directly
  against the S3 data — no database server required. Finally, I launched a
  SageMaker notebook instance, cloned my project repo into it, and loaded the
  query results into pandas for exploration and modeling prep.
results_impact: >
  Successfully queried 200,000 rows of complaint data in seconds using SQL without
  any local processing. Identified patterns in complaint volume by agency and
  borough, and built a modeling-ready dataset exported back to S3. Documented the
  full workflow in a public GitHub repository.
repo_url: "https://github.com/A-Phipps/aws-nyc311"
