title: "Making Data Science Easy to Share"

short_summary: "I took a messy project and turned it into a professional toolkit. Now, anyone can run my analysis without worrying about setup errors."

tech_stack:
  - Python
  - Docker
  - uv (Package Manager)
  - GitHub
  - Shell Scripting

problem_statement: "Most data science code only works on the person's computer who wrote it. This makes it impossible for others to verify the results or build on the work."

approach: "I organized the files into a clear folder system and used a tool called Docker to package everything together. This means the code brings its own environment with it so it works the same way for everyone."

results_impact: "The project is now more reliable. Instead of spending hours trying to get the code to run, a new user can get everything started with just one simple command."

