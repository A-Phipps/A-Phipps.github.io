title: "SQL Analytic Story: Film Rental Trends"

short_summary: >
  Conducted a stakeholder-focused analysis of the Sakila database using advanced SQL. 
  Identified top-performing genres and customer behavior patterns to provide 
  actionable business insights.

tech_stack:
  - MySQL
  - Docker
  - Python (SQLAlchemy)
  - Jupyter Notebooks
  - Pandas

problem_statement: >
  Managing a massive film inventory requires understanding which genres drive the 
  most revenue and which customer segments are most active. Without a structured 
  analysis, store managers are left making inventory decisions based on intuition 
  rather than data.

approach: >
  I used a Dockerized MySQL instance to query the Sakila dataset. My analysis involved 
  joining multiple tables (category, film, rental, and payment) to calculate 
  running totals and rank genres. I utilized Common Table Expressions (CTEs) to 
  organize my queries. 

results_impact: >
  The analysis successfully identified the 'Sports' and 'Sci-Fi' genres as the 
  highest revenue generators. I delivered a final report that visualized these 
  trends, providing an idea for future inventory management and 
  specific marketing strategies for high-value customers.

